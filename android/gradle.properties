android.useAndroidX=true
android.aapt2FromMaven=false

# Отключаем фоновые демоны, которые крашатся в PRoot
org.gradle.daemon=false
# Заставляем aapt2 работать в основном процессе
android.aapt2.daemon=false


# Deduplicate instructions in Dart VM release snapshots (required in product mode)

android.aapt2FromMavenOverride=/usr/bin/aapt2
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=2
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
