org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# Системный aapt2 (Debian 2.19) не читает android-36 android.jar, поэтому
# берём настоящий aapt2 из Maven (Maven-версия AGP поддерживает compileSdk 36).
android.aapt2FromMaven=true

# Отключаем фоновые демоны, которые крашатся в PRoot
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.workers.max=6
# Заставляем aapt2 работать в основном процессе
android.aapt2.daemon=false

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
