android.useAndroidX=true
android.aapt2FromMaven=false

# Отключаем фоновые демоны, которые крашатся в PRoot
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# Заставляем aapt2 работать в основном процессе
android.aapt2.daemon=false

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

# Deduplicate instructions in Dart VM release snapshots (required in product mode)

android.aapt2FromMavenOverride=/usr/bin/aapt2
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
