name: quantum_ide
description: "QuantumIDE - A next-generation AI-powered mobile IDE for web development built with Flutter."
publish_to: 'none'
version: 1.2.212+229

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  permission_handler: ^11.4.0
  flutter_lucide: 1.9.0
  flex_color_scheme: ^8.4.0
  flutter_inappwebview: ^6.1.5
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  path: ^1.9.1
  uuid: ^4.5.1
  dio: ^5.8.0+1
  archive: ^4.5.2
  url_launcher: ^6.3.2
  open_filex: ^4.5.0
  diff_match_patch: ^0.4.1
  desktop_drop: ^0.7.1
  flutter_markdown_plus: ^1.0.12
  photo_view: ^0.15.0
  fl_chart: ^0.70.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  # Mobile UX & IDE Tools
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^13.3.1
  dartssh2: ^2.22.1
  wakelock_plus: ">=1.6.1 <1.8.1"
  
  crypto: ^3.0.6
  sqflite: ^2.4.4+2
  watcher: ^1.2.1
  sqflite_common_ffi: ^2.4.4
  qr_flutter: ^4.1.0
  quick_actions: ^1.1.1
  flutter_colorpicker: ^1.1.0
  talker_flutter: ^4.8.4
  device_frame: ^1.4.0
  audioplayers: ^6.8.1

  # High-performance & Modern Packages
  gpt_markdown: ^1.4.0
  connectivity_plus: ^6.1.1
  dio_smart_retry: ^6.0.0
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.2
  reorderables: ^0.6.0
  battery_plus: ^7.1.2
  haptic_feedback: ^0.5.1

  # AI Agent & Streaming Engine
  langchain: ^0.9.0
  langchain_openai: ^0.9.0
  streamdown: ^0.1.1
  flutter_markdown_stream: ^0.6.1

  # Code Tools, Formatting & File Inspection
  dart_style: ^3.1.14
  mime: ^2.1.0
  glob: ^2.2.0
  yaml: ^3.1.4
  yaml_writer: ^2.1.0
  pretty_diff_text: ^2.1.0

  # Advanced UI & Voice
  skeletonizer: ^3.0.0
  badges: ^4.0.1
  speech_to_text: ^7.5.0

  # Embedded Web Server, Virtualized Tree & Advanced DevTools
  shelf: ^1.4.3
  shelf_static: ^1.2.0
  flutter_fancy_tree_view: ^1.6.0
  substring_highlight: ^1.0.33
  ansicolor: ^2.0.3
  xml: ^6.5.0
  json_path: ^0.9.0

  # Next-gen UI, Math & Fast Storage
  flutter_animate: ^4.5.2
  flutter_math_fork: ^0.7.2
  hive_ce: ^2.1.0
  hive_ce_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/bin/
    - assets/init-host.sh
  fonts:
    - family: firaCode
      fonts:
        - asset: assets/fonts/FiraCode-Medium.ttf
    - family: cascadia
      fonts:
        - asset: assets/fonts/CascadiaCodePL-Regular.ttf
    - family: hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: dejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
    - family: inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
    - family: jetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
    - family: proggy
      fonts:
        - asset: assets/fonts/ProggyVector-Regular.ttf
    - family: sourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf
    - family: SymbolsNerdFont
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf
    - family: "Symbols Nerd Font"
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf
    - family: Seti
      fonts:
        - asset: assets/fonts/Seti.ttf
