# QuantumIDE - рабочий pubspec.yaml (с AI-пакетами, без которых не собирается inference_engine)
# Убраны только: 5 шрифтов (экономия ~2-3 MB), обновлены версии dev-зависимостей

name: quantum_ide
description: "QuantumIDE - A next-generation AI-powered mobile IDE for web development built with Flutter."
publish_to: 'none'
version: 1.1.6+18

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  re_editor: ^0.9.0
  re_highlight: ^0.0.3
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  permission_handler: ^11.3.1
  flutter_lucide: ^1.9.0
  flex_color_scheme: ^8.4.0
  flutter_inappwebview: ^6.1.5
  google_generative_ai: ^0.4.6
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  google_fonts: ^6.3.3
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  path: ^1.9.1
  uuid: ^4.5.1
  dio: ^5.8.0+1
  archive: ^4.0.2
  url_launcher: ^6.3.2
  open_filex: ^4.5.0
  diff_match_patch: ^0.4.1
  file_icon: ^1.0.0
  desktop_drop: ^0.7.1
  flutter_markdown: ^0.7.7+1
  photo_view: ^0.15.0
  fl_chart: ^0.70.2
  device_info_plus: ^11.3.0
  package_info_plus: ^8.1.3
  # Mobile UX
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  # AI inference (required by inference_engine.dart)
  sqflite: ^2.4.2
  ffi: ^2.1.2
  llama_flutter_android: ^0.2.6
  flutter_litert_lm: ^0.3.0
  flutter_fancy_tree_view: ^1.6.0
  watcher: ^1.2.1
  multi_split_view: ^3.6.2
  contextmenu: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/init-host.sh
  fonts:
    - family: firaCode
      fonts:
        - asset: assets/fonts/FiraCode-Medium.ttf
    - family: jetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
    - family: sourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf