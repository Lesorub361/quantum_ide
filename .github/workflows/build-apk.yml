name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version (leave default)
        required: false
        default: '3.44.9'
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'true'
      version:
        description: 'Release version, e.g. 1.1.9 (used as the git tag)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (markdown). Shown in the GitHub Release body.'
        required: false
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_NOTES: |
        ## 🚀 QuantumIDE v1.2.46 - Device Manager, USB OTG Phone-to-Phone, Wi-Fi ADB & Autonomous AI Mobile Testing

        ### 📱 Phone-to-Phone USB OTG & Device Manager:
        - **Android Studio-like Device Manager**: Плашка выбора активного устройства в верхней панели инструментов и нижнем статус-баре (`DeviceSelectorPill`).
        - **Детектор аппаратного USB Host (OTG)**: Автоматическая проверка поддержки USB Host режима смартфоном и отображение подключенных устройств.
        - **1-Click Run & Install**: Установка и запуск скомпилированных APK на внешнем телефоне прямо из IDE.
        - **Logcat Viewer & Screenshot**: Снятие скриншотов с экрана подключенного телефона с предпросмотром и чтение системных логов крашей (Logcat *:E).
        - **Wi-Fi ADB (Wireless Debugging)**: Беспроводное подключение по IP:порт и сопряжение по 6-значному коду для Android 11+.

        ### 🤖 Автономное тестирование с ИИ (AI Mobile Testing):
        - **Глобальная утилита `quantum-device`**: Управление девайсом из терминала (`list`, `connect`, `screenshot`, `inspect`, `tap`, `type`, `swipe`, `key`, `logcat`).
        - **ИИ-инструменты в агенте**: Набор функций `device_list`, `device_screenshot`, `device_inspect_ui`, `device_tap`, `device_type`, `device_key`, `device_get_logs`, `device_install_app`.
        - **Полный цикл QA**: ИИ делает скриншоты, изучает XML-дерево виджетов, нажимает кнопки, вводит текст, ловит краши и сам исправляет код в проекте!

        ### 🌐 Мультиплатформенная сборка:
        - **Android**: Universal APK, Split ABIs (ARM64, ARMv7, x86_64) и App Bundle (AAB).
        - **Linux**: x64 и ARM64 (`quantum_ide-linux-x64.tar.gz`, `quantum_ide-linux-arm64.tar.gz`).
        - **Windows**: x64 и ARM64 (`quantum_ide-windows-x64.zip`, `quantum_ide-windows-arm64.zip`).
        - **macOS**: Universal bundle (`quantum_ide-macos.zip`).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.9' }}
          cache: true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          elif [ -f "android/app/release-key.jks" ]; then
            echo "Using tracked release-key.jks from repository."
            if [ ! -f "android/key.properties" ]; then
              printf 'storePassword=quantum123\nkeyPassword=quantum123\nkeyAlias=quantum_ide\nstoreFile=release-key.jks\n' > android/key.properties
            fi
          else
            echo "WARNING: no KEYSTORE_BASE64 secret — APK will be signed with the debug key."
          fi

      - name: Print tool versions
        run: |
          flutter --version
          java -version 2>&1 | head -1

      - name: Ensure native llama dependencies
        run: |
          if [ ! -d "local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp" ] || [ -z "$(ls -A local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp 2>/dev/null)" ]; then
            bash scripts/setup_llama.sh
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (Universal & Split ABIs)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-universal-release.apk
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-release.apk
          flutter build appbundle --release --no-tree-shake-icons || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-android-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          name: QuantumIDE ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          body: ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || env.DEFAULT_NOTES }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-universal-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
