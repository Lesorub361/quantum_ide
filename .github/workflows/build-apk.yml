name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version (leave default)
        required: false
        default: '3.47.8'
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'true'
      version:
        description: 'Release version, e.g. 1.1.9 (used as the git tag)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (markdown). Shown in the GitHub Release body.'
        required: false
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_NOTES: |
        ## 🚀 QuantumIDE v1.2.102 - Умная однократная синхронизация проектов (Smart One-Time Sync)

        ### ⚡ Автосинхронизация только при необходимости:
        - **Однократная синхронизация при открытии**: Синхронизация проекта (`flutter pub get`, `npm install`, `pip install`) теперь выполняется только 1 раз при первом открытии проекта или если зависимости ещё не скачаны (`.dart_tool/package_config.json`, `node_modules`).
        - **Молниеносный старт без всплывающего баннера**: Если проект уже синхронизирован и файлы манифестов не менялись, проект открывается мгновенно — плавающий баннер синхронизации больше не всплывает и не расходует ресурсы.
        - **Автоматический запуск при добавлении зависимостей**: При сохранении изменений в `pubspec.yaml`, `package.json` или `requirements.txt` редактор автоматически распознаёт новые пакеты и запускает синхронизацию.

        ## 🚀 QuantumIDE v1.2.101 - Устранение вылетов (OOM crash) и зависаний планшета при открытии проекта, фильтрация кэшей .gradle и оптимизация синхронизации

        ### 🛡️ Ликвидация утечки памяти (1.2 GB RAM) и зависаний при открытии проектов:
        - **Облегчённая синхронизация Flutter-проектов**: Ранее при каждом открытии проекта автоматически запускалась тяжелая задача `./gradlew :app:dependencies`, которая стартовала 3 фоновых процесса AAPT2 и 3 Gradle Daemons, разогревая процессор планшета до 100% и создавая более 50 000 кэш-файлов. Теперь авто-синхронизация выполняет только быстрый `flutter pub get` и быструю проверку настроек `gradle.properties` без тяжелого запуска Gradle.
        - **Блокировка служебных папок сборщика в Проводнике (`FileTreeFilter`)**: Директории `.gradle`, `.cxx`, `.cache`, `.git`, `.dart_tool`, `node_modules` больше не сканируются и не порождают системные файловые наблюдатели (inotify watchers) в Проводнике.
        - **Автоматическая очистка развёрнутых папок**: При старте IDE автоматически очищает сохранённый список развёрнутых папок от служебных каталогов Gradle, предотвращая рекурсивную загрузку тысяч файлов в память Flutter.
        - **Защита поиска и авто-раскрытия**: Поиск по файлам больше не раскрывает глубокие структуры кэшей сборки и ограничен безопасным порогом, предотвращая зависание UI-потока.

        ## 🚀 QuantumIDE v1.2.100 - Исправление компиляции виджета StatusBar и детальный мониторинг ОЗУ сборщика

        ### 🔧 Исправление сборки в GitHub Actions:
        - **Корректное объявление переменных `toolsRamBytes` в `StatusBar`**: Вынесен расчёт объёма памяти инструментов сборщика из литерала списка виджетов в тело метода `build()`, устранив синтаксическую ошибку Dart `Expected an identifier, but got 'final'`.
        - **Прозрачный учёт ОЗУ во вкладке «Производительность»**: Раздельное отображение памяти интерфейса IDE и фонового сборщика Gradle с наглядными процентами от общего объёма ОЗУ устройства.

        ## 🚀 QuantumIDE v1.2.99 - Детализация памяти во вкладке «Производительность» и раздельный учёт памяти сборщика и интерфейса

        ### 📊 Понятное и прозрачное отображение оперативной памяти в Диспетчере задач:
        - **Раздельный учёт памяти интерфейса IDE и процессов сборщика (Gradle/AAPT2/Linux)**: Ранее во вкладке «Производительность» отображалась только память процесса графического интерфейса IDE (299 MB, 4% от 7.2 GB), из-за чего полоска казалась почти пустой, а сотни мегабайт памяти фонового сборщика Gradle Daemon не учитывались в сводке. Теперь добавлены отдельная строка памяти сборщика (`850 MB (11.8% ОЗУ)`) и проценты от общего объёма ОЗУ, а подсказка внизу сообщает, сколько памяти держат фоновые демоны сборки.

        ## 🚀 QuantumIDE v1.2.98 - Ликвидация дублирования и лесенки промпта в терминале, устранение «xterm unknown» и оптимизация AAPT2/CPU в Диспетчере задач

        ### 🖥️ Полная ликвидация дублирования промпта терминала («лесенки» и повторов `lesorub_pro`):
        - **Перевод формирования промпта на `PROMPT_COMMAND`**: Ранее управляющие символы `\r\e[K` внутри `\[...\]` в `PS1` и command substitution `$(__git_info)` ломали подсчёт столбцов в readline. При изменении размера экрана (SIGWINCH), смене вкладок или закрытии клавиатуры bash сдвигал курсор вправо, дублируя строку ввода 3–4 раза по диагонали экрана. Теперь `PS1` собирается через `PROMPT_COMMAND`, цветные последовательности корректно экранированы, а промпт всегда отображается строго один раз у левого края.
        - **Устранение предупреждения `'xterm': unknown terminal type`**: Вызов `clear` при старте bashrc переведён на безопасный ANSI-сброс `clear 2>/dev/null || printf '\033[2J\033[H'`, исключая вывод ошибок terminfo.

        ### ⚡ Оптимизация Диспетчера задач и реальные показатели процессора:
        - **Исправление показаний процессора для «Quantum IDE [Это приложение]»**: Ранее процессу IDE ошибочно присваивалась суммарная нагрузка процессора всего устройства (до 85%). Теперь IDE считывает свой реальный процент загрузки из таблицы `ps` (1–3% ЦП), а общая нагрузка системы отображается на вкладке «Производительность».
        - **Усиленная кнопка «Очистить ОЗУ»**: Кнопка очистки памяти теперь принудительно гасит зависшие процессы `aapt2` (`pkill -9 -f aapt2`), `GradleDaemon`, `flutter_tools`, а также очищает кэш изображений Flutter.
        - **Ограничение воркеров AAPT2 до 1 процесса**: Во все команды сборки APK добавлены флаги `-Porg.gradle.workers.max=1 -Porg.gradle.parallel=false` и автоматическая подчистка `aapt2` после компиляции. Gradle больше не запускает 3 параллельных процесса AAPT2, сохраняя температуру устройства.
        - **Точная фильтрация «Terminal Session»**: Устранено отображение служебных системных вызовов в виде десятков пустых терминальных сессий.

        ## 🚀 QuantumIDE v1.2.97 - Устранение синтаксической ошибки mksh export в init-host и успешная синхронизация проектов

        ### 🔧 Устранение ошибки «export: -XX:MaxMetaspaceSize=512m: is not an identifier»:
        - **Разделение присваивания переменных и вызова `export` в оболочке Android mksh**: В системном командном интерпретаторе Android (`/system/bin/sh` mksh) встроенная команда `export` строго контролирует синтаксис аргументов. Вложенные кавычки в `GRADLE_OPTS` приводили к разбиению строки, из-за чего флаг JVM `-XX:MaxMetaspaceSize=512m` воспринимался как имя переменной и вызывал ошибку «is not an identifier» (код возврата 1) в скрипте `init-host`.
        - **Корректная передача параметров памяти JVM**: Параметры кучи и метаспейса (`-Xmx2048m -XX:MaxMetaspaceSize=512m`) теперь экспортируются отдельно через чистую глобальную переменную `_JAVA_OPTIONS`, которая автоматически подхватывается всеми процессами JVM, Gradle и Flutter без конфликтов кавычек в `GRADLE_OPTS`.
        - **Успешная синхронизация проектов (Sync exit code 0)**: Скрипт `init-host` теперь исполняется без предупреждений и ошибок синтаксиса shell, обеспечивая стабильную синхронизацию и запуск проектов.

        ## 🚀 QuantumIDE v1.2.96 - Исправление компиляции сборки APK и импортов провайдеров

        ### 🔧 Устранение ошибок компиляции в GitHub Actions:
        - **Корректный статус `ProjectSyncStatus.idle` в `cancelSync()`**: Устранена ошибка `No named parameter with the name 'isSyncing'`.
        - **Импорт `dart:io` в строке состояния (`StatusBar`)**: Предоставлен доступ к `pid` процесса в таблице Диспетчера задач.
        - **Импорт `project_sync_service.dart` в панелях терминала**: Устранены ошибки `The getter 'projectSyncProvider' isn't defined` в `run_build_panels.dart` и `terminal_panel_content.dart`.

        ## 🚀 QuantumIDE v1.2.95 - Диспетчер задач в стиле Windows: мониторинг процессов, пакетов, нагрузки CPU и памяти ОЗУ

        ### 🖥️ Полноценный Диспетчер задач (Task Manager) в стиле Windows:
        - **Вкладка «Процессы и пакеты» с детальной таблицей**: При нажатии на индикаторы CPU/RAM в строке состояния теперь открывается полноценный Диспетчер задач, как в Windows. Отображаются все активные процессы системы, сборщики и пакеты:
          - **Gradle Build Daemon**: фоновый сборщик APK и зависимостей Gradle.
          - **Dart Analysis Server**: анализатор кода, автодополнение и линтер.
          - **Kotlin Compiler Daemon**: компилятор Kotlin.
          - **Java Virtual Machine (JVM)**: среда исполнения Java.
          - **PRoot / Terminal**: терминальные сессии и гостевая песочница Linux.
          - **AI / LLM Engines & Agents**: Antigravity CLI, Claude Code, DeepSeek Harness, Ollama/Llama.
          - **Компиляторы C/C++ & AAPT2**: Clang, GCC, AAPT2, Zipalign.
        - **Индивидуальная нагрузка каждого процесса**: Для каждой задачи и пакета в реальном времени показывается точный процент загрузки процессора (`ЦП %`) с цветовой индикацией и занимаемая оперативная память (`МБ / ГБ`).
        - **Снятие задач и завершение зависших процессов («Снять задачу» / Кнопка ✕)**: Пользователь может в один клик завершить любой отдельный процесс или демон прямо из таблицы задач.
        - **Быстрые фильтры по категориям**: Мгновенная фильтрация по чипам `Все`, `Сборка`, `Компилятор`, `Языковой сервер`, `ИИ / Агенты`, `Песочница`, `Терминал`.
        - **Кнопка «Очистить все фоновые демоны»**: Мгновенная остановка всех демонов сборки (Gradle, Kotlin, Analysis Server) для освобождения гигабайтов оперативной памяти.

        ## 🚀 QuantumIDE v1.2.94 - Исправление запуска Antigravity CLI на Android, устранение ANR зависания интерфейса и поддержка встроенного терминала для авторизации

        ### 🛡️ Устранение ошибки «ProcessException: Permission denied Command: agy»:
        - **Вызов Antigravity CLI через гостевое окружение PRoot (`init-host`)**: На платформе Android приложения не могут напрямую запускать бинарники через хостовый `Process.start` из-за ограничений безопасности Android (SELinux/noexec). Вся процедура авторизации Antigravity CLI теперь переведена на запуск внутри PRoot через `init-host` с передачей переменной `SSH_CONNECTION`, что гарантирует бесперебойную генерацию OAuth-ссылки для браузера и подтверждение одноразового кода.
        - **Кнопка «Терминал» открывает встроенный терминал IDE**: Нажатие кнопки «Терминал» в окне настроек агентов теперь немедленно закрывает модальное окно и открывает интерактивную сессию `agy` во встроенном терминале Quantum IDE, где пользователь видит живой интерфейс авторизации с полной поддержкой ввода.
        - **Синхронизация списка моделей через гостевую среду**: Получение моделей `agy models` на Android переведено на вызов через `RuntimeService`, исключая любые ошибки доступа.

        ### ⚡ Полная ликвидация зависаний приложения (ANR - «quantum_ide не отвечает»):
        - **Удаление синхронных вызовов `Process.runSync` на главном UI-потоке**: Вызовы `Process.runSync` в `CliAgentBridge` заблокированы на мобильных ОС. Они больше не останавливают основной UI-лупер Flutter, исключая появление системного диалога ANR.
        - **Защита от бесконечного зависания команд через таймаут (20 секунд)**: В `RuntimeService.runCommand` добавлен автоматический таймаут на вызовы `Process.run`, что гарантирует немедленное освобождение очереди команд даже при зависании сторонних утилит.
        - **Мгновенный возврат версий агентов до инициализации рантайма**: Функция `refreshInstalledAgents` больше не сканирует файловую систему и не тормозит запуск диалога настроек агентов.

        ## 🚀 QuantumIDE v1.2.93 - Автоматическое устранение Java heap space, оптимизация нагрузки на процессор (CPU) и идеальная очистка вывода сборки

        ### ⚡ Автоматическое устранение ошибки «Java heap space» в Gradle и Jetifier:
        - **Выделение 2 ГБ оперативной памяти для JVM (`-Xmx2048m -XX:MaxMetaspaceSize=512m`)**: В системные переменные `_JAVA_OPTIONS`, `GRADLE_OPTS`, а также в `android/gradle.properties` и `~/.gradle/gradle.properties` теперь автоматически внедряется достаточный лимит кучи Java. Виртуальная машина больше не падает по нехватке памяти при обработке библиотек.
        - **Отключение устаревшего Jetifier (`android.enableJetifier=false`)**: Блокирована бессмысленная распаковка и перепаковка 30-мегабайтного архива движка Flutter (`arm64_v8a_debug.jar`) в оперативной памяти, которая приводила к мгновенному падению сборки. Сборка ускорена в 3 раза.

        ### 🧠 Кардинальная оптимизация нагрузки на процессор (CPU):
        - **Ограничение воркеров Gradle до 1 (`--max-workers=1`)**: На мобильных устройствах с 3–4 ядрами многопоточный Gradle забивал 100% процессора. Перевод на 1 воркер оставляет процессорные ядра свободными для интерфейса IDE и редактора кода.
        - **Автоматическая отмена фоновой синхронизации при запуске сборки**: Если пользователь нажимает кнопку сборки APK или запуска проекта, фоновый процесс `ProjectSyncService` немедленно отменяется (`cancelSync()`), исключая одновременную работу двух параллельных процессов Gradle и перегрузку процессора/ОЗУ.

        ### 🖥️ Идеально чистый терминал при сборке APK:
        - **Мгновенная очистка эхо-ввода через ANSI (`\033[2J\033[H\033[3J`)**: При запуске сборки весь служебный 500-символьный скрипт, эхо-символы и многострочные переносы `>` мгновенно стираются с экрана терминала. Пользователь видит только аккуратный статус `▶ flutter build apk --debug` и чистые логи сборки.
        - **Устранение `'xterm': unknown terminal type`**: Настроена мягкая иерархия детекции терминала с проверкой файлов terminfo (`xterm-256color` → `xterm` → `linux` → `ansi`), исключающая сообщения о неизвестном типе терминала.

        ## 🚀 QuantumIDE v1.2.92 - Исправление компиляции сборки APK и валидатора логов синхронизации

        ### 🔧 Исправление сборки в GitHub Actions:
        - **Корректное объявление переменной `lower` в `ProjectSyncNotifier`**: Устранена ошибка компиляции Dart (`Error: The getter 'lower' isn't defined for the type 'ProjectSyncNotifier'`), из-за которой прерывался этап `compileFlutterBuildRelease` в CI/CD сборщике.
        - **Стабильная фильтрация логов Flutter и предупреждений root**: Все механизмы подавления ложных ошибок синхронизации проектов и вывода чистых команд сборки работают в штатном режиме.

        ## 🚀 QuantumIDE v1.2.91 - Устранение дублирования промпта при масштабировании терминала, очистка вывода сборки APK и фильтрация ложных ошибок Flutter root

        ### 🖥️ Исправление дублирования строки ввода терминала при изменении размера и полноэкранном режиме:
        - **Ликвидация тройного промпта (`➜ lesorub_pro git:(main) $`)**: Ранее при открытии терминала, изменении размера вкладки или разворачивании на весь экран сигнал SIGWINCH приводил к повторной отрисовке строки ввода со сдвигом вправо или вниз. В `.bashrc` включена опция `shopt -s checkwinsize 2>/dev/null || true` и гарантирован возврат каретки с очисткой строки (`\r\e[K`) в начале `$PS1`.
        - **Корректные non-printable escape-последовательности в Git-статусе**: Вспомогательная функция `__git_info()` переведена на строгие readline-ограничители `\[` и `\]`. Теперь bash readline точно вычисляет видимую ширину строки без горизонтальных и вертикальных наложений.

        ### 📦 Аккуратный и красивый вывод команд компиляции APK в консоль:
        - **Устранение огромных нечитаемых bash-скриптов и артефактов `Closure: ...`**: Ранее при нажатии на кнопку «Собрать APK» в терминал вываливался весь 500-символьный внутренний bash-скрипт с экранированными строками, sed и регулярными выражениями. Теперь система выводит лаконичный, аккуратный заголовок с понятным именем действия (например, `▶ flutter build apk --release` или `▶ ./gradlew assembleRelease`), после чего сразу идут чистые логи компиляции.
        - **Универсальная поддержка в терминальных панелях**: Параметр красивого отображения команды (`displayCmd`) интегрирован во все кнопки сборки и запуска (Flutter, Android Gradle, Dart, Node.js, Python, Rust).

        ### 🛡️ Устранение ложного счетчика «Ошибки (4)» при синхронизации проекта:
        - **Фильтрация предупреждений Flutter суперпользователя (root)**: Предупреждения Flutter об обнаружении root (`Woah! You appear to be trying to run flutter as root`, `We strongly recommend running the flutter tool without superuser privileges`) и символы анимации прогресса (`/`, `📎`), попадавшие в поток `stderr`, больше не классифицируются как ошибки компиляции или сбои проекта. В счетчик проблем теперь попадают исключительно реальные ошибки сборки и зависимостей.

        ## 🚀 QuantumIDE v1.2.90 - Исправление установки и верификации статуса пакета «Flutter Release APK Fix (x86_64 GLIBC)»

        ### 📦 Устранение сброса статуса кнопки «Установить» в менеджере пакетов:
        - **Корректная регистрация в `PackageService`**: Пакет `flutter-release-fix` добавлен в обработчики проверки установленного состояния (`_checkActualInstallation()`) для сред Android PRoot и Linux Desktop, а также в белый список сохранённых идентификаторов пакетов. Ранее отсутствие этой проверки приводило к тому, что после закрытия диалога статус пакета сбрасывался обратно на «Установить».
        - **Проверка динамического загрузчика и маркеров**: Состояние готовности пакета теперь проверяется по наличию `/lib64/ld-linux-x86-64.so.2`, `/lib/x86_64-linux-gnu/libc.so.6` и маркера `~/.quantum_flutter_release_fix_installed`. После установки пакет гарантированно получает статус «Ready» (зелёный значок готовности).

        ### 🖥️ Прозрачный лог выполнения установки x86_64 GLIBC:
        - **Отображение хода загрузки и настройки**: Удалено принудительное подавление вывода `2>/dev/null || true` в команде установки. Теперь диалоговое окно честно показывает пользователю запуск скрипта `quantum-heal-x64`, проверку x86_64 библиотек и динамического загрузчика, исключая иллюзию мгновенного пустого выполнения.
        - **Связка с «Build Environment Fix»**: Установка комплексного пакета сборки теперь также автоматически помечает и верифицирует `flutter-release-fix`.

        ## 🚀 QuantumIDE v1.2.89 - Полноценная Gradle и Flutter синхронизация зависимостей и скачивание пакетов

        ### ⚡ Реальная загрузка Gradle и Android зависимостей при синхронизации (как в ACSide / Android Studio):
        - **Загрузка всех нативных Android библиотек для Flutter плагинов**: Синхронизация Flutter проектов больше не ограничивается одним лишь `flutter pub get`. После скачивания Dart-пакетов Quantum IDE автоматически входит в модуль `android/`, применяет безопасные опции (`-Djava.net.preferIPv4Stack=true`, `-Pandroid.aapt2.daemon=false`, `--no-daemon`, `--max-workers=2`) и запускает реальное дерево разрешения зависимостей `./gradlew :app:dependencies` (с fallback на `--info help`).
        - **Реальное скачивание .AAR, .JAR, .POM и трансформация Jetifier**: Зависимости плагинов (Яндекс.Реклама, Камера, Google Play Services, SQLite, AndroidX Core, Datastore, OkHttp и др.) реально загружаются в кэш `~/.gradle/caches`, распаковываются и трансформируются в фоновом режиме до компиляции.
        - **Удаление бесполезного `--dry-run` в проектах Gradle**: В нативных Android/Gradle проектах убран флаг `--dry-run`, который запрещал Gradle скачивать библиотеки. Теперь Gradle полноценно синхронизирует и выкачивает конфигурацию проекта.

        ### 📱 Ненавязчивый интерфейс синхронизации без перекрытия редактора кода:
        - **Разделение плавающего баннера и шторки логов**: Нижняя панель логов (260px) больше не вылезает автоматически на 40% экрана при открытии проекта.
        - **Свертывание и развертывание по клику**: Поверх редактора отображается только компактный верхний статус-бар с индикатором прогресса и текущим шагом. При тапе по баннеру открывается/складывается подробная консоль вывода логов.
        - **Авто-раскрытие только при ошибках**: Если синхронизация завершилась с ошибкой, панель логов автоматически раскрывается, позволяя сразу увидеть причину сбоя.
        - **Живой парсинг процесса скачивания**: Из длинных URL библиотек парсится конкретное имя файла (`Downloading: core-ktx-1.17.0.aar`, `Transforming: jetified-play-services-tasks...`, `Fetching variant dependencies...`).

        ### 🛠 Автоматическая загрузка недостающих пакетов при компиляции APK:
        - **Гарантированная предкомпиляционная подготовка в Терминале и панели Сборки**: Перед вызовом `flutter build apk` и `gradlew assembleRelease/assembleDebug` автоматически проверяются и настраиваются `android/gradle.properties` и `~/.gradle/gradle.properties` (инъекция нативного ARM64 AAPT2, отключение демона, фикс NDK, `flutter pub get`). Все недостающие библиотеки выкачиваются автоматически в процессе сборки.

        ## 🚀 QuantumIDE v1.2.88 - Исправление лестничного сдвига терминала, сбоев AAPT2 daemon, D-Pad навигации и полная 5-язычная локализация

        ### 🕹️ Новый эргономичный D-Pad блок стрелок и исправление перекрытия кнопок:
        - **Классический крестовидный D-Pad блок (T-образный)**: Стрелки больше не выстроены в одну неудобную прямую линию. Теперь навигационный блок разделен на две выровненные строки: верхняя строка `[ DEL ] [ ↑ ] [ END ] [ KB ]`, нижняя строка `[ ← ] [ ↓ ] [ → ] [ More ]`.
        - **Устранение обрезания и сползания кнопок под интерфейс**: Убран фиксированный ограничитель высоты тулбара (56px) и добавлен `SafeArea(top: false, bottom: true)`. Виртуальные кнопки больше не сползают под навигационную полосу Android, системные жесты и статус-бар.

        ### 🖥️ Исправление терминала: лесенка промпта, xterm-256color и изоляция сокетов PRoot:
        - **Ликвидация «лесенки» (staircase effect) строки ввода**: В `.bashrc` и `init-host` внедрен флаг драйвера псевдотерминала `stty sane onlcr`. Ранее символ новой строки (`\n`) без возврата каретки (`\r`) смещал промпт вправо по диагонали (`➜ lesorub_pro git:(main) $`). Теперь курсор всегда корректно возвращается в нулевую колонку.
        - **Автоисправление `'xterm-256color': unknown terminal type`**: Добавлена интеллектуальная проверка наличия terminfo базы данных в PRoot, автоматическое создание симлинков `/usr/share/terminfo` и мягкий фоллбэк на `xterm` / `linux`.
        - **Изоляция `PROOT_TMP_DIR` (устранение `can't chmod ...: No such file or directory`)**: Временные сокеты и файлы PRoot теперь размещаются в изолированном каталоге процесса `$FILES_DIR/proot_tmp/p_$$`, а не в общем `$FILES_DIR/tmp`. Параллельные процессы и очистка гостевого `/tmp` больше не удаляют активные сокеты PRoot во время работы.

        ### 📦 Устранение сбоя сборки APK (`AAPT2 Daemon startup failed`):
        - **Отключение Daemon режима AAPT2**: В `flutter build apk` и `gradle.properties` принудительно добавлены `-Pandroid.aapt2.daemon=false`, `-Pandroid.aapt2FromMaven=false` и `-Pandroid.aapt2FromMavenOverride=/usr/bin/aapt2`.
        - **Автозамена x86_64 AAPT2 на нативный ARM64**: Скрипт `quantum-patch-ndk` теперь автоматически находит все скачанные Gradle x86_64 бинарники AAPT2 в кэше `~/.gradle/caches` и заменяет их на нативный ARM64 `/usr/bin/aapt2`.

        ### 🌐 Полная мультиязычная локализация (5 языков: EN, RU, ES, FR, ZH):
        - **Перевод через официальные файлы локализации (`lib/l10n/app_*.arb`)**: Все жестко зашитые русские строки («ЗАПУСК КОМАНДЫ», «СЕССИИ», «Установить APK», «Клава», «Ещё», «Работает», «Остановлен», «Разделить экран», «Не гасить экран», «Прервать (Ctrl+C)») заменены на ключи `AppLocalizations` и переведены на все 5 поддерживаемых языков приложения (английский, русский, испанский, французский, китайский).

        ## 🚀 QuantumIDE v1.2.87 - Наведение полного порядка в панели «Пакеты» и умная категоризация

        ### 📦 Кардинальная очистка и реорганизация раздела пакетов:
        - **Ликвидация дубликатов пакетов**: Удалены повторяющиеся записи (объединены дубли Flutter SDK 3.47, устранены 5 дублирующих пакетов `build-tools-34/35/36`, объединены дубли `rust-arm64` и `rust-lsp`).
        - **Очистка устаревших и неактуальных пакетов**: Удалены древние неиспользуемые SDK Platform (API 21, 24, 26, 28, 29, 37), а также нерабочие пакеты (`kilocode-cli`, `opencode-ai`, `ndk-r29`).
        - **6 упорядоченных категорий с цветовым кодированием**:
          - 🌐 `Languages` (Flutter & Dart SDK, Node.js, Python, Go, Rust, Java OpenJDK 21)
          - 🤖 `AI Tools` (Antigravity CLI, Claude Code, DeepSeek Harness, Ollama CLI, Local AI Qwen)
          - ⚙️ `Build Tools` (Android SDK, Build Tools & Platform Tools ARM64, CMake, NDK, Mold Linker, Box64, Vulkan, Gradle, APK Signing)
          - 📱 `SDK Platforms` (Android 11 API 30 до Android 16 API 36)
          - 🧩 `IDE Plugins` (Clangd, Rust Analyzer, Gopls, Pyright, TypeScript, HTML/CSS, YAML/JSON, Marksman, Java JDTLS, Kotlin LS)
          - 🛠 `Tools` (Git, Git LFS, Ripgrep, GitHub CLI, Bun, UV, PNPM, SQLite, Protobuf Compiler)
        - **Фильтр «Installed» с динамическим счетчиком**: Во вкладке пакетов терминала добавлен удобный фильтр установленных пакетов `Installed (X)`.
        - **Синхронизация с проверкой требований проекта**: `ProjectRequirementsService` обновлен для бесшовной работы с очищенными идентификаторами пакетов.

        ## 🚀 QuantumIDE v1.2.86 - Полное устранение PRoot `ENOSYS` и прямой запуск команд через `/bin/bash`

        ### 🛡️ Устранение `Function not implemented` (ENOSYS) и `can't chmod` на Android 14 (Kernel 6.1):
        - **Отказ от `PROOT_NO_SECCOMP=1` и очистка `LD_PRELOAD`**: Удаление принудительного отключения seccomp возвращает PRoot к штатному BPF-seccomp режиму. На Android 14 устаревший `PTRACE_SYSCALL` блокировался ядром, вызывая ошибку 38 (`ENOSYS`) на `chmod`, `chdir` и `execve`.
        - **Автоочистка зависших сокетов PRoot (`rm -rf "$TMPDIR"/proot-*`)**: Перед стартом PRoot временная директория очищается от устаревших сокетов предыдущих сбойных сессий, исключая ошибку `proot error: can't chmod`.
        - **Прямой запуск команд через `/bin/bash` (без `/usr/bin/env`)**: В скрипте `init-host` команды больше не оборачиваются в `/usr/bin/env`, исключая сбой вторичного `execve`. Команды `/bin/bash -c ...` исполняются напрямую внутри главного процесса оболочки без дочерних порождений.
        - **Устранение `xargs: echo: Function not implemented`**: Команда сбора информации о процессоре в терминале переведена на `sed`, убирая ненужный вызов `xargs`.
        - **Исправление `cd` в панелях Сборки и Запуска**: Пути проектов перед переходом теперь гарантированно нормализуются через `PathMapper.mapToGuest`, и целевая папка автоматически создаётся (`mkdir -p`), исключая сбой `bash: cd: ...: Function not implemented`.

        ### (v1.2.85) Самовосстановление Ubuntu rootfs (PRoot `Function not implemented`)

        ### 🛡️ Устранение ошибки PRoot «Function not implemented» (ENOSYS) на Android 12/13/14 (Kernel 6.x):
        - **Отключение несовместимой SECCOMP-акселерации (`PROOT_NO_SECCOMP=1`)**: Ядро Android 14 блокирует системные вызовы через seccomp в дочерних процессах, что приводило к ошибкам `execve("/usr/bin/env"): Function not implemented`, `can't chmod: Function not implemented`, `can't chdir: Function not implemented`. Включение `PROOT_NO_SECCOMP=1` во всех точках запуска (`init-host`, `ProcessManager`, `TerminalTabs`, `DedicatedTerminal`) гарантирует стабильное выполнение системных вызовов через классический ptrace.
        - **Гарантированное создание рабочих директорий перед `chdir`**: В `init-host` добавлена авто-проверка и создание путей (`/root/projects/...`, `/sdcard/...`) до передачи управления PRoot `--cwd`.
        - **Авто-определение пути к `env`**: Динамический выбор `/usr/bin/env` или `/bin/env` для надежности запуска фоновых команд и скриптов.

        ### 🔄 Надежность авто-синхронизации проектов (Auto-Sync) и Gradle:
        - **Устранение «Ошибка синхронизации (код -9)»**: Отмена предыдущего процесса или смена вкладки больше не выдает ложное сообщение об ошибке.
        - **Безопасные параметры запуска Gradle**: В команду проверки Gradle добавлены `--no-daemon -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1` для предотвращения вылета по памяти (OOM / SIGKILL -9).
        - **Стабильная установка исправлений из менеджера пакетов**: Установка «Flutter Release APK Fix (x86_64 GLIBC)» и «Build Environment Fix» теперь отрабатывает штатно.

        ### 🛠 Исправление ошибки Release сборки Flutter (`/lib64/ld-linux-x86-64.so.2: No such file or directory`):
        - **Автоматическая установка x86_64 glibc и динамического загрузчика (`quantum-heal-x64`)**: Настроена мультиархитектурная поддержка `amd64` и автоматическая распаковка `libc6:amd64` и `libstdc++6:amd64` для QEMU.
        - **Исправление обёртки Flutter `gen_snapshot`**: Добавлен префикс `QEMU_LD_PREFIX=/` и аргумент `-L /`, гарантирующий запуск официального AOT компилятора Google на устройствах ARM64.
        - **Пакет восстановления в настройках**: Добавлен отдельный пакет "Flutter Release APK Fix (x86_64 GLIBC)" во вкладку Пакетов и расширен общий "Build Environment Fix".

        ### 🔄 Автоматическая синхронизация проекта при открытии (Auto-Sync):
        - Баннер в верхней части экрана с индикатором процесса и состояниями (синхронизация, успех, ошибка).
        - Модальная шторка с вкладками: «Вывод», «Проблемы», «Логи приложения», нумерацией строк в реальном времени, кнопкой «Поделиться логом» и закрытием.

        ### 📋 Исправление тулбара выделения текста в редакторе кода:
        - Кнопки «Копировать», «Вставить», «Вырезать», «Выделить всё» работают стабильно во всех файлах.

        ### ⚡ Кардинальная оптимизация ОЗУ и производительности на планшетах и телефонах:
        - **Лимит кучи Dart Analysis Server (`--old_gen_heap_size=384`)**: Снижение потребления памяти фоновым анализатором в 3–4 раза.
        - **Авто-остановка неиспользуемых LSP-серверов**: Фоновые языковые серверы выгружаются при закрытии последнего файла соответствующего языка.
        - **Ограничение пула процессов (`RuntimeService`) и изолятов (`SymbolIndexerService`)**: Исключены пиковые перегрузки CPU/RAM при открытии больших проектов.
        - **Устранение ребилдов UI и `BackdropFilter` лагов**: Оптимизированы `EditorPage`, `EditorNotifier` и `GlassContainer` на мобильных GPU.

        ### ⌨️ Исправление ввода и отображения терминала при открытии клавиатуры:
        - **Прямой `TextInputClient` (`_AndroidTerminalDirectInput`)**: Полностью устранено «прыгание» русских/латинских букв по углам экрана (вверх/вниз/вправо) при печати в TUI-приложениях (`agy`, `claude`, `vim`, `htop`).
        - **Позиционирование над экранной клавиатурой (`bottom: keyboardInset`)**: Нижняя панель терминала на планшетах и телефонах больше не перекрывается клавиатурой и не мерцает при её открытии.
        - **Умное отключение автодополнения путей в TUI**: Всплывающее окно подсказок больше не мешает работе в `agy` и других интерактивных CLI.

        ### 📦 Исправление проверки пакетов и локальной сборки APK «из коробки»:
        - **Корректное распознавание симлинков в PRoot (`followLinks: false`)**: Окно «Необходимые компоненты» больше не появляется повторно при каждом запуске проекта.
        - **Готовая локальная сборка APK (`build-tools` 34/35/36 + `platforms` 34/35/36)**: Автоматическое комплектование `d8`, `core-lambda-stubs.jar`, `apksigner`, `aapt2` и CMake/Ninja для сборки проектов сразу после установки IDE.

        ### 🤖 Исправление встроенного ИИ-чат-бота (`AINotifier` & `CliAgentBridge`):
        - **Немедленное выполнение действий на 1-м шаге**: Устранена ошибка, из-за которой `Planner` отбрасывал блок `<actions>` на первом шаге.
        - **Корректная передача истории и ошибок `replace_code_block`**: Чат-бот теперь видит результаты команд и ошибки сопоставления блоков, автоматически перечитывает файл через `read_file` и доводит исправления до конца.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.47.8' }}
          cache: true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          elif [ -f "android/app/release-key.jks" ]; then
            echo "Using tracked release-key.jks from repository."
            if [ ! -f "android/key.properties" ]; then
              printf 'storePassword=quantum123\nkeyPassword=quantum123\nkeyAlias=quantum_ide\nstoreFile=release-key.jks\n' > android/key.properties
            fi
          else
            echo "WARNING: no KEYSTORE_BASE64 secret — APK will be signed with the debug key."
          fi

      - name: Print tool versions
        run: |
          flutter --version
          java -version 2>&1 | head -1

      - name: Ensure Android NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "Pre-installing NDK 28.2.13676358 with retry..."
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" && break || {
                echo "Attempt $attempt failed, cleaning temp and retrying..."
                rm -rf "$ANDROID_HOME/.temp"
                sleep 5
              }
            done
          fi

      - name: Ensure native llama dependencies
        run: |
          if [ ! -d "local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp" ] || [ -z "$(ls -A local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp 2>/dev/null)" ]; then
            bash scripts/setup_llama.sh
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (Universal & Split ABIs)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-universal-release.apk
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-release.apk
          flutter build appbundle --release --no-tree-shake-icons || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-android-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || (startsWith(github.ref_name, 'v') && github.ref_name || 'v1.2.48') }}
          name: QuantumIDE ${{ github.event.inputs.version != '' && github.event.inputs.version || (startsWith(github.ref_name, 'v') && github.ref_name || 'v1.2.48') }}
          body: ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || env.DEFAULT_NOTES }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-universal-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
