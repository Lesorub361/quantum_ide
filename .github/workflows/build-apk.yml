name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version (leave default)
        required: false
        default: '3.44.9'
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'true'
      version:
        description: 'Release version, e.g. 1.1.9 (used as the git tag)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (markdown). Shown in the GitHub Release body.'
        required: false
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_NOTES: |
        ## 🚀 QuantumIDE v1.2.40 - Offline AI Hub, Safe Mode Toggle, 16GB Memory Guard & High-Precision Controls

        ### 🧠 Локальный ИИ (Offline Edge AI Hub):
        - **🛡️ Переключатель «Безопасный режим» (Safe Mode Toggle)**:
          - Возможность включать или отключать безопасный режим прямо в интерфейсе настроек.
          - При отключении снимаются все лимиты памяти — можно принудительно запускать любые тяжелые модели на свой страх и риск.
          - Слайдер слоев GPU/NPU расширяется до 99 слоев.
        - **💾 Распознавание подкачки Android (RAM Plus / zRAM / Swap до 16 ГБ)**:
          - Чтение `SwapTotal` и `SwapFree` из ядра Android.
          - На устройствах с 8 ГБ RAM + 8 ГБ подкачки приложение видит все 16 ГБ суммарного пула памяти и учитывает его при оценке стабильности.
        - **⚡ Точная синхронизация длины контекста**:
          - Чипы от 512 до 32K токенов. Выбранный контекст строго передаётся в флаг `-c` сервера без искажений.
        - **💻 Динамическое определение ядер процессора**:
          - Слайдер CPU Threads автоматически адаптируется под реальное число ядер чипсета смартфона.
        - **🌐 Интерактивные хабы Hugging Face & Ollama**:
          - Бейджи: Зрение (Vision), Контекст (128K/64K/32K), Код (Coder), Рассуждения (DeepSeek R1), RAM-требования и ориентировочная скорость.
          - Загрузка моделей Ollama в 1 клик с потоковым прогрессом.
        - **📋 Экспорт логов сервера**:
          - Кнопка копирования всех логов llama-server / Ollama в буфер обмена телефона в 1 клик.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.9' }}
          cache: true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "WARNING: no KEYSTORE_BASE64 secret — APK will be signed with the debug key."
          fi

      - name: Print tool versions
        run: |
          flutter --version
          java -version 2>&1 | head -1

      - name: Ensure native llama dependencies
        run: |
          if [ ! -d "local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp" ] || [ -z "$(ls -A local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp 2>/dev/null)" ]; then
            bash scripts/setup_llama.sh
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (Universal & Split ABIs)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-universal-release.apk
          cp /tmp/app-universal-release.apk build/app/outputs/flutter-apk/app-release.apk
          flutter build appbundle --release --no-tree-shake-icons || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-android-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          name: QuantumIDE ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          body: ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || env.DEFAULT_NOTES }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-universal-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
