name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version (leave default)
        required: false
        default: '3.44.9'
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.9' }}
          cache: true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "WARNING: no KEYSTORE_BASE64 secret — APK will be signed with the debug key."
          fi

      - name: Print tool versions
        run: |
          flutter --version
          java -version 2>&1 | head -1

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuantumIDE ${{ github.ref_name }}
          body: |
            ## QuantumIDE ${{ github.ref_name }}

            ### Local AI engines
            - Added **Mistral.rs (Rust)** as a local engine — a fast Rust LLM server, faster than llama.cpp on CPU. Connect to a `mistralrs-server` over the network (OpenAI-compatible API).
            - **LM Studio** kept as a local engine option.
            - Local engine model lists no longer show fake default models — only real models (downloaded catalog models for the built-in engine, or models actually loaded in Ollama / LM Studio / Mistral.rs).

            ### Model storage
            - Downloaded models on mobile are saved next to your projects (`<app>/projects/ai_models`), so they survive and can be re-added or replaced manually.

            ### Chat experience
            - Chat mode is now a clean conversational assistant (like OpenCode): streamed output, visible reasoning, may read files / search the web to answer — but never loops as an autonomous agent. Modification actions are still proposed for confirmation.
            - Agent / Autopilot mode remains for autonomous implementation.

            ### Networking
            - Added a **LAN scanner** in Local AI settings: auto-discovers Ollama (`:11434`), Mistral.rs / LM Studio (`:1234`), llama-server (`:8080`) and other OpenAI-compatible servers on your Wi-Fi, with one-tap connect.
            - Added "Test connection" for local servers.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}