name: Build Linux Desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            artifact: quantum_ide-linux-x64
          - arch: arm64
            os: ubuntu-24.04-arm
            artifact: quantum_ide-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config build-essential \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgl1-mesa-dev libxrender-dev libxrandr-dev libglib2.0-dev \
            libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Setup Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory $HOME/flutter

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release (${{ matrix.arch }})
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package Linux Bundle
        run: |
          if [ -d "build/linux/${{ matrix.arch }}/release/bundle" ]; then
            cd build/linux/${{ matrix.arch }}/release/bundle
          else
            cd build/linux/*/release/bundle
          fi
          tar -czvf /tmp/${{ matrix.artifact }}.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/${{ matrix.artifact }}.tar.gz
          retention-days: 14

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/${{ matrix.artifact }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
