name: Build Windows Desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows x64 release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package Windows x64 Bundle
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath quantum_ide-windows-x64.zip
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path build\windows\runner\Release\* -DestinationPath quantum_ide-windows-x64.zip
          } else {
            Write-Error "Release build directory not found"
            exit 1
          }

      - name: Build Windows ARM64 release
        continue-on-error: true
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release --target-platform=windows-arm64 --no-tree-shake-icons

      - name: Package Windows ARM64 Bundle
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "build\windows\arm64\runner\Release") {
            Compress-Archive -Path build\windows\arm64\runner\Release\* -DestinationPath quantum_ide-windows-arm64.zip
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum_ide-windows
          path: quantum_ide-windows-*.zip
          retention-days: 14

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quantum_ide-windows-x64.zip
            quantum_ide-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
